site_name: HuHoBotPenguin Docs
site_description: QQ 开放平台官方机器人 × Minecraft 基岩版（BDS / LeviLamina LLSE）桥接插件
site_url: https://huhobot.github.io/PenguinBDSClient/
repo_url: https://github.com/HuHoBot/PenguinBDSClient
repo_name: HuHoBot/PenguinBDSClient
copyright: Copyright &copy; 2026 HuHoBot

theme:
  name: material
  language: zh
  palette:
    - scheme: default
      primary: deep purple
      toggle:
        icon: material/weather-night
        name: 切换到夜间模式
    - scheme: slate
      primary: deep purple
      toggle:
        icon: material/weather-sunny
        name: 切换到日间模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

nav:
  - 首页: index.md
  - 快速开始: quickstart.md
  - 配置说明: config.md
  - 群指令: commands.md
  - 指令面板: panel.md
  - 附属插件 API: addon-api.md
  - AI 版（Llama）: ai.md
  - LuckyClover 联动: luckyclover.md
  - 故障排查: troubleshooting.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - def_list
